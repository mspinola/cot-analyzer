# cot-analyzer example configuration.
#
# Public SAMPLE. Ships so the app runs out of the box with a small generic
# universe and untuned 52-week lookbacks. Point COT_VIZ_CONFIG (and cotmetrics'
# COTMETRICS_PARAMS) at your own file to supply a real universe / tuning.

# price_type and flow_caps were both removed 2026-08-23, along with the
# cotmetrics CotIndexer.load_price_config method that was the only reader of
# either. flow_caps had one consumer, the intra-week gap estimator
# estimate_current_gap_positions, deleted in cotmetrics 734bbc6 as an ADR-0006
# prerequisite. price_type had no consumer in any surviving checkout, and since
# ADR-0007 it has nothing to select between: stored bars carry no settlement
# column, because both futures providers already put settlement IN Close.

# Lookback windows (weeks) computed for every COT report.
lookbacks:
  - ["6-months", 26]
  - ["1-years", 52]

# Years of COT data to download and process.
years: [2020, 2021, 2022, 2023, 2024, 2025, 2026]

# Instrument role: deploy (plotted, default), watch (plotted, not in book),
# heldout (indexed but never plotted/selected).
roles:
  default: deploy

# Color palettes for the plot/theme dropdowns (UI only).
#
# Slots are positional and mean the same thing in every palette:
#   0 Commercials   1 Large Specs   2 Small Traders   3 Price   4 Open Interest
#   5 Volatility
#
# Append-only. Renumbering a slot silently repaints every chart in the app, and each
# palette's sixth colour is chosen to be distinct from its own other five rather than
# to match the other palettes: Cyberpunk already spends purple on Small Traders, so it
# takes orange where the rest take a violet.
palettes:
  "Muted": ["#F87171", "#60A5FA", "#FBBF24", "#34D399", "#ABB8C9", "#A78BFA"]
  "Vibrant": ["#FF453A", "#0A84FF", "#FFD60A", "#00FF00", "#E2E8F0", "#BF5AF2"]
  "Cyberpunk": ["#FF007F", "#00E5FF", "#BF5AF2", "#00FF00", "#ABB8C9", "#FF9F0A"]
  "CMR": ["#e70307", "#0000ff", "#ffff00", "#00FF00", "#E2E8F0", "#ff00ff"]
  "Solarized": ["#dc322f", "#268bd2", "#b58900", "#2aa198", "#fdf6e3", "#6c71c4"]

# A small, generic universe. Public futures tickers, untuned 52-week lookbacks.
AssetClasses:
  - Equities:
      - { Name: "S&P 500", Symbol: "ES", CustomLookbackWeeks: 52, TV_Chart: "SPY" }
      - { Name: "Nasdaq", Symbol: "NQ", CustomLookbackWeeks: 52, TV_Chart: "QQQ" }
      - { Name: "Russell 2000", Symbol: "RTY", CustomLookbackWeeks: 52, TV_Chart: "IWM", Role: heldout }
  - Metals:
      - { Name: "Gold", Symbol: "GC", CustomLookbackWeeks: 52, TV_Chart: "GOLD" }
      - { Name: "Silver", Symbol: "SI", CustomLookbackWeeks: 52, TV_Chart: "SILVER" }
  - Energies:
      - { Name: "Crude Oil", Symbol: "CL", CustomLookbackWeeks: 52, TV_Chart: "USOIL" }
