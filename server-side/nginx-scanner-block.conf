# Refuse vulnerability-scanner traffic at the proxy, before it reaches the app.
#
# A SNIPPET, included into the site's server block, rather than the site block itself.
# That block is written and rewritten by `certbot --nginx` (it owns the listen
# directives, the certificate paths and its own `# managed by Certbot` lines), so a
# committed copy of it would be a fork of a file certbot edits. One include line inside
# it is the smallest thing that survives a certificate reissue.
#
#   cp server-side/nginx-scanner-block.conf /etc/nginx/snippets/
#   # then, inside the server block holding `proxy_pass http://127.0.0.1:5001`,
#   # above its `location / {`:
#   #     include snippets/nginx-scanner-block.conf;
#   nginx -t && systemctl reload nginx
#
# Find that block rather than assuming which file it is in; it may be inline in
# nginx.conf, in sites-enabled/, or in conf.d/, and it need not be a TLS block:
#
#   nginx -T | grep -nE "^# configuration file|listen |server_name |proxy_pass "
#
# This is a complement to `DropScannerNoise` in src/main.py, not a duplicate of it. That
# filter hides the app's echo of a request that already happened; this stops the request.
# Anything matched here costs no Flask request, no visitor_logs row and no ip-api.com
# lookup, which is the part that mattered: the free tier is 45/min and a sweep spends it
# on addresses nobody will ever read.
#
# 444 is nginx's own code for "close the connection, send nothing". A scanner learns
# less from it than from a 403 (no server banner, no body, no code to branch on) and it
# is cheaper to serve. Nothing here is logged by journalctl, since nginx answers without
# involving the unit; nginx's own access log still has every one of them if you want to
# count them.

# The CVE-2024-4577 PHP-CGI argument injection probe, the successor to CVE-2012-1823.
# It arrives as `POST /?%ADd+allow_url_include%3d1+%ADd+auto_prepend_file%3dphp://input`,
# where %AD is a soft hyphen that a Windows best-fit codepage folds into a real `-`, so
# the query string becomes CGI arguments. It matched nothing in the path-based rules
# below because the path IS `/`, a route this app serves, which is also why it reached
# the app as a 405 rather than a 404.
#
# A bare `if` at server level containing only `return` is one of the two forms nginx
# documents as safe; the "if is evil" warning is about `if` inside `location` wrapping
# anything else.
if ($args ~* "(auto_prepend_file|allow_url_include|php://|base64_decode)") {
    return 444;
}

# Credential and config files, and the admin panels of software that does not run here.
# Anchored to a path SEGMENT (`(?:^|/)`) rather than floating, so a real asset named
# something like `chart.environment.css` cannot match `\.env`. Segment-anchoring also
# catches the nested forms the sweeps actually use: /.env, /env/.env, /config/.env.
location ~* (?:^|/)(\.env|\.git|\.aws|\.ssh|\.vscode|wp-|wordpress|phpmyadmin|vendor/|cgi-bin/) {
    return 444;
}

# Extensions belonging to stacks this box does not run. A regex location outranks the
# `location /` prefix that proxies to the app, so these never reach it. No page path or
# asset here ends in any of them (assets are .js and .css), so there is nothing to
# shadow.
location ~* \.(php|phtml|asp|aspx|jsp|cgi|sh|bak|sql|old)$ {
    return 444;
}
