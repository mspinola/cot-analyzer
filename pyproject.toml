[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-analyzer"
version = "1.0.0"
description = "Dash/Plotly web UI for COT positioning index, signals, and analysis."
readme = "README.md"
authors = [
    {name = "Matt S.", email = "cotanalyzer@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "dash==4.3.0",
    "dash-ag-grid==35.2.0",
    "dash-bootstrap-components==2.0.4",
    "dash-core-components==2.0.0",
    "dash-html-components==2.0.0",
    "dash-table==5.0.0",
    "Flask-Compress==1.24",
    "gunicorn==23.0.0",
    "markdown==3.9",
    "numpy==2.0.2",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "pytz==2026.2",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "cotdata>=0.1.0",
    # Bars; ADR-0007 moved them out of cotdata. The DISTRIBUTION is
    # crucible-marketdata (`marketdata` on PyPI is an unrelated abandoned
    # project); the IMPORT that cotmetrics uses is still `marketdata`.
    # Floor is 0.2.0, not 0.1.0, and it is a CORRECTNESS floor rather than a
    # nominal one: cotmetrics 0.4.0 values each COT week at the contract
    # multiplier in force that week, and reads the regime table that marketdata
    # 0.2.0 introduced. Against 0.1.0 cotmetrics raises rather than silently
    # pricing the Russell's pre-2016 weeks at half their true notional.
    "crucible-marketdata>=0.2.0",
    # Floor is 0.6.0 because /exposure ranks over a trailing window with
    # `windowed_pct_rank` / `windowed_quantile` and passes `rank_window` to the
    # aggregate. Against 0.5.0 those do not exist, so the Lookback control
    # raises AttributeError the moment anything but All history is chosen.
    #
    # 0.5.0 was itself a correctness floor, for the `sigma_weighted` column the
    # volatility panel draws: absent, the figure falls back to three panels and
    # nothing says why, which is the quiet kind of wrong a floor exists to
    # prevent. Both reasons stand; the higher number covers both.
    "cotmetrics[options]>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.22"]

[project.urls]
Repository = "https://github.com/mspinola/cot-analyzer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
